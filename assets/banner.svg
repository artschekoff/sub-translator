<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip">
      <rect width="1280" height="400" rx="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="200" cy="200" rx="300" ry="180" fill="#00d2ff" opacity="0.04" filter="url(#blur1)"/>
  <ellipse cx="1100" cy="200" rx="280" ry="160" fill="#7b2ff7" opacity="0.06" filter="url(#blur1)"/>
  <ellipse cx="640" cy="380" rx="400" ry="100" fill="#00d2ff" opacity="0.03" filter="url(#blur1)"/>

  <!-- Grid lines (subtle) -->
  <g opacity="0.04" stroke="#4499ff" stroke-width="0.5">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="960" y1="0" x2="960" y2="400"/>
    <line x1="1120" y1="0" x2="1120" y2="400"/>
  </g>

  <!-- Film strip left -->
  <g opacity="0.25">
    <rect x="40" y="60" width="60" height="280" rx="4" fill="none" stroke="#4499ff" stroke-width="1"/>
    <rect x="47" y="75"  width="46" height="32" rx="2" fill="#1a2a3a"/>
    <rect x="47" y="117" width="46" height="32" rx="2" fill="#1a2a3a"/>
    <rect x="47" y="159" width="46" height="32" rx="2" fill="#1a2a3a"/>
    <rect x="47" y="201" width="46" height="32" rx="2" fill="#1a2a3a"/>
    <rect x="47" y="243" width="46" height="32" rx="2" fill="#1a2a3a"/>
    <rect x="47" y="285" width="46" height="32" rx="2" fill="#1a2a3a"/>
    <!-- sprocket holes -->
    <circle cx="70" cy="67"  r="4" fill="#0d0d1a"/>
    <circle cx="70" cy="333" r="4" fill="#0d0d1a"/>
  </g>

  <!-- Film strip right -->
  <g opacity="0.25">
    <rect x="1180" y="60" width="60" height="280" rx="4" fill="none" stroke="#7b2ff7" stroke-width="1"/>
    <rect x="1187" y="75"  width="46" height="32" rx="2" fill="#1a1228"/>
    <rect x="1187" y="117" width="46" height="32" rx="2" fill="#1a1228"/>
    <rect x="1187" y="159" width="46" height="32" rx="2" fill="#1a1228"/>
    <rect x="1187" y="201" width="46" height="32" rx="2" fill="#1a1228"/>
    <rect x="1187" y="243" width="46" height="32" rx="2" fill="#1a1228"/>
    <rect x="1187" y="285" width="46" height="32" rx="2" fill="#1a1228"/>
    <circle cx="1210" cy="67"  r="4" fill="#0d0d1a"/>
    <circle cx="1210" cy="333" r="4" fill="#0d0d1a"/>
  </g>

  <!-- Top accent line (gradient) -->
  <rect x="0" y="0" width="1280" height="2" fill="url(#accent)"/>

  <!-- Glow sweep under title -->
  <rect x="140" y="140" width="700" height="120" fill="url(#glow1)" filter="url(#blur2)" rx="60"/>

  <!-- Terminal prompt decoration -->
  <text x="148" y="168" font-family="monospace" font-size="22" fill="#00d2ff" opacity="0.6">$</text>
  <text x="172" y="168" font-family="monospace" font-size="22" fill="#4499ff" opacity="0.4">subtrans</text>
  <text x="300" y="168" font-family="monospace" font-size="22" fill="#888" opacity="0.35">-from en -to es movie.mkv</text>

  <!-- Main title -->
  <text x="148" y="248"
        font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, monospace"
        font-size="82" font-weight="700" letter-spacing="-2"
        fill="url(#accent)" filter="url(#glow)">subtrans</text>

  <!-- Subtitle text -->
  <text x="150" y="288"
        font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, sans-serif"
        font-size="20" font-weight="300" letter-spacing="2" fill="#8ab4cc" opacity="0.85">
    MKV · MP4 · AVI  •  subtitle translator  •  built with Go
  </text>

  <!-- Language badges -->
  <g transform="translate(150, 316)">
    <rect width="40" height="22" rx="11" fill="#00d2ff" opacity="0.12"/>
    <rect x="0.5" y="0.5" width="39" height="21" rx="10.5" fill="none" stroke="#00d2ff" stroke-width="0.7" opacity="0.4"/>
    <text x="20" y="15.5" text-anchor="middle" font-family="monospace" font-size="11" fill="#00d2ff" opacity="0.9">EN</text>
  </g>
  <text x="200" y="330" font-family="monospace" font-size="13" fill="#4499ff" opacity="0.5">→</text>
  <g transform="translate(218, 316)">
    <rect width="40" height="22" rx="11" fill="#7b2ff7" opacity="0.12"/>
    <rect x="0.5" y="0.5" width="39" height="21" rx="10.5" fill="none" stroke="#7b2ff7" stroke-width="0.7" opacity="0.4"/>
    <text x="20" y="15.5" text-anchor="middle" font-family="monospace" font-size="11" fill="#cc88ff" opacity="0.9">ES</text>
  </g>
  <g transform="translate(272, 316)">
    <rect width="40" height="22" rx="11" fill="#7b2ff7" opacity="0.12"/>
    <rect x="0.5" y="0.5" width="39" height="21" rx="10.5" fill="none" stroke="#7b2ff7" stroke-width="0.7" opacity="0.4"/>
    <text x="20" y="15.5" text-anchor="middle" font-family="monospace" font-size="11" fill="#cc88ff" opacity="0.9">FR</text>
  </g>
  <g transform="translate(326, 316)">
    <rect width="40" height="22" rx="11" fill="#7b2ff7" opacity="0.12"/>
    <rect x="0.5" y="0.5" width="39" height="21" rx="10.5" fill="none" stroke="#7b2ff7" stroke-width="0.7" opacity="0.4"/>
    <text x="20" y="15.5" text-anchor="middle" font-family="monospace" font-size="11" fill="#cc88ff" opacity="0.9">DE</text>
  </g>
  <g transform="translate(380, 316)">
    <rect width="40" height="22" rx="11" fill="#7b2ff7" opacity="0.12"/>
    <rect x="0.5" y="0.5" width="39" height="21" rx="10.5" fill="none" stroke="#7b2ff7" stroke-width="0.7" opacity="0.4"/>
    <text x="20" y="15.5" text-anchor="middle" font-family="monospace" font-size="11" fill="#cc88ff" opacity="0.9">RU</text>
  </g>
  <text x="428" y="330" font-family="monospace" font-size="13" fill="#4499ff" opacity="0.3">+ more</text>

  <!-- Bottom accent line -->
  <rect x="0" y="398" width="1280" height="2" fill="url(#accent)" opacity="0.4"/>

  <!-- Corner decoration -->
  <text x="1060" y="210" font-family="monospace" font-size="11" fill="#4499ff" opacity="0.2" text-anchor="start">
    <tspan x="1060" dy="0">ffmpeg · ffprobe</tspan>
    <tspan x="1060" dy="18">google translate api</tspan>
    <tspan x="1060" dy="18">iso 639-1/2 aware</tspan>
    <tspan x="1060" dy="18">zero dependencies</tspan>
  </text>

</svg>